<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drape</title>
<meta name="description" content="Paste a link to clothes you're eyeing and a link to a piece that fits you well. Get honest, size-by-size fit notes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one board you can take in at a glance. Each part is a card with a sewn-in label on its edge.
   Garment pieces show up as swinging hang tags; the tailor's tape measures, counts and fills progress. */
:root {
  --bg: #f3f4f1;
  --fg: #1c211f;
  --muted: #59625e;
  --line: #d3d8d3;
  --accent: #2b4775;      /* denim */
  --accent-fg: #ffffff;
  --field: #ffffff;
  --tape: #e3cf8f;        /* tape-measure yellow */
  --tape-soft: #f1e5bd;
  --hl: #f4c430;          /* highlighter */
  --tape-ink: #3a3420;
  --label: #fbfbf8;       /* care-label cotton */
  --good: #2f6b4f;
  --snug: #94600f;
  --bad: #a3392a;
  --roomy: #2b6577;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-accent: "Bricolage Grotesque", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121615; --fg: #e8ebe7; --muted: #a3aca7; --line: #2b3331;
    --accent: #a3bbe8; --accent-fg: #0f141c; --field: #1a1f1e;
    --tape: #b59d55; --tape-soft: #3a3423; --tape-ink: #1d1a10; --hl: #a8801a; --label: #1a1f1e;
    --good: #7cc4a0; --snug: #e0b25e; --bad: #f08a78; --roomy: #7ec0d4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121615; --fg: #e8ebe7; --muted: #a3aca7; --line: #2b3331;
  --accent: #a3bbe8; --accent-fg: #0f141c; --field: #1a1f1e;
  --tape: #b59d55; --tape-soft: #3a3423; --tape-ink: #1d1a10; --hl: #a8801a; --label: #1a1f1e;
  --good: #7cc4a0; --snug: #e0b25e; --bad: #f08a78; --roomy: #7ec0d4;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 1.0625rem/1.55 var(--font-body);
  padding-inline: 16px;
  padding-block: 0 72px;
}
.wrap { max-width: 34rem; margin-inline: auto; }
p { margin: 0; }
p, li { text-wrap: pretty; }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: 400; text-wrap: balance; }
h1 { font-size: clamp(1.75rem, 7.4vw, 2.5rem); line-height: 1.06; letter-spacing: -0.025em; }
h1 em, h2 em, h3 em { font-style: normal; color: var(--accent); }
h2 { font-size: 1.45rem; line-height: 1.12; letter-spacing: -0.015em; }
h3 { font-size: 1.08rem; font-weight: 600; letter-spacing: -0.005em; }
a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.ph { display: inline-block; }
.muted { color: var(--muted); }
.small { font-size: 0.92rem; }

/* ---- Small type with some personality ---- */
.eyebrow { font: 600 0.7rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
/* Friendly asides */
.aside { font: 500 1rem/1.45 var(--font-body); color: var(--fg); }
.aside b { font-style: normal; font-family: var(--font-body); font-size: 0.82em; font-weight: 700; }
/* Highlighter in tape yellow for the words that matter */
mark, .hl { background: linear-gradient(transparent 40%, var(--hl) 40%, var(--hl) 94%, transparent 94%); color: inherit; font-weight: 700; padding: 0 3px; border-radius: 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.num { font: 600 0.95em/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

/* Sewn-in label on the edge of each card */
.tag {
  position: absolute; top: -13px; left: 14px;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 10px 5px 6px;
  background: var(--label); border: 1px solid var(--line); border-radius: 3px;
  font: 600 0.7rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.13em; color: var(--fg);
  box-shadow: inset 0 0 0 3px var(--label), inset 0 0 0 4px color-mix(in srgb, var(--muted) 45%, transparent);
}
.tag b {
  display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%;
  background: var(--tape); color: var(--tape-ink); font: 700 0.68rem/1 var(--font-mono); letter-spacing: 0;
}
.tag.done b { background: var(--good); color: var(--bg); }

/* Top line */
nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 18px 0; }
.mark { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; }
.mark b { font: 700 1.12rem/1 var(--font-display); letter-spacing: -0.01em; }
.mark .seal { font: 600 0.62rem/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; padding: 4px 6px; border: 1px dashed var(--muted); border-radius: 3px; color: var(--muted); }
.navr { display: flex; align-items: center; gap: 14px; }
.navr button { background: none; border: 0; padding: 4px 0; cursor: pointer; }
.navr button:hover { color: var(--fg); }
.backbar { display: flex; align-items: center; min-height: 44px; padding-top: 10px; }
.backbtn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 8px 10px 8px 0; cursor: pointer; color: var(--muted); font: 700 0.98rem/1 var(--font-body); min-height: 44px; }
.backbtn:hover { color: var(--fg); }
.backbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.view { display: flex; flex-direction: column; gap: 30px; padding-block: 30px 0; }
.backbar:not([hidden]) + main .view { padding-top: 10px; }
.view.enter { animation: rise .3s ease both; }
@keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lede { color: var(--muted); font-size: 1.08rem; }

/* Cards on the board */
.bcard { position: relative; background: var(--field); border: 1px solid var(--line); border-radius: 16px; padding: 26px 16px 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; transition: opacity .25s ease; }
.bcard.dim { opacity: .55; }
.card { background: var(--field); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* Buttons */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--field); color: var(--fg); font: 700 1rem/1.2 var(--font-body);
  cursor: pointer; text-align: center; transition: transform .08s ease, filter .15s ease, opacity .2s;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); font-weight: 400; min-height: 40px; padding: 8px; }
.btn.ghost:hover { color: var(--fg); }
.btn .pmark { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 0.85rem/1 var(--font-body); border: 1px solid var(--line); color: var(--muted); }
.linkish { background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); font-size: 0.9rem; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; align-self: flex-start; }
.linkish:hover { color: var(--fg); }

/* Link field */
.seam { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 5px; gap: 6px; }
.seam:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.seam input { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: transparent; border: 0; padding: 11px; }
.seam input:focus { outline: none; }
.seam input::placeholder { color: var(--muted); }
.seam .btn { min-height: 44px; flex: none; padding: 10px 16px; }
.hint { color: var(--muted); font-size: 0.9rem; }
.hint.warn { color: var(--bad); }

/* Chips. Picked chips get a stitched inner seam. */
.chip {
  position: relative; min-height: 44px; padding: 10px 16px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--field);
  font: 700 0.96rem/1 var(--font-body); cursor: pointer;
  transition: transform .08s ease, background-color .15s ease;
  display: inline-flex; align-items: center; gap: 8px;
}
.chip:active { transform: scale(.94); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.chip[aria-pressed="true"]::after { content: ""; position: absolute; inset: 3px; border-radius: inherit; border: 1px dashed color-mix(in srgb, var(--accent-fg) 55%, transparent); pointer-events: none; }
.chip.sm { min-height: 36px; padding: 8px 12px; font-size: 0.88rem; }
.chip.lite { font-weight: 400; }
.chip svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.chip.just { animation: pick .38s cubic-bezier(.3,1.7,.5,1); }
@keyframes pick { 0% { transform: scale(.88); } 100% { transform: none; } }
.chip.size { min-width: 48px; padding: 10px 12px; justify-content: center; font: 700 1.02rem/1 var(--font-mono); }

/* Hang tag for a garment we recognized: pointed tag shape, stitched edge, style labels */
.hangtag { position: relative; filter: drop-shadow(0 0 0.6px var(--muted)) drop-shadow(0 1px 1px color-mix(in srgb, var(--fg) 8%, transparent)); transform-origin: 0 50%; }
.hangtag-in {
  position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  padding: 13px 14px 13px 30px; background: var(--label);
  clip-path: polygon(16px 0, 100% 0, 100% 100%, 16px 100%, 0 50%);
}
.hangtag-in::before { content: ""; position: absolute; inset: 5px 5px 5px 20px; border: 1px dashed color-mix(in srgb, var(--muted) 55%, transparent); border-radius: 2px; pointer-events: none; }
.hangtag .t { font: 700 1rem/1.3 var(--font-body); overflow-wrap: anywhere; }
.hangtag .b { font: 600 0.68rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
.hangtag .sz { position: absolute; right: 12px; top: 11px; font: 700 0.85rem/1 var(--font-mono); padding: 4px 7px; border-radius: 4px; background: var(--tape); color: var(--tape-ink); }
.hangtag.has-sz .hangtag-in { padding-right: 58px; }
.lbls { display: flex; flex-wrap: wrap; gap: 5px; }
.lbl { font: 600 0.64rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: .1em; padding: 4px 6px; border-radius: 3px; border: 1px solid var(--line); background: var(--field); color: var(--fg); }
.lbl.cat { background: var(--tape); border-color: var(--tape); color: var(--tape-ink); }
.fx-swing { animation: swing 1.2s cubic-bezier(.25,.9,.35,1) both; }
@keyframes swing { 0% { transform: rotate(-9deg) translateY(-4px); opacity: 0; } 18% { opacity: 1; } 35% { transform: rotate(5deg); } 55% { transform: rotate(-2.5deg); } 75% { transform: rotate(1deg); } 100% { transform: none; } }

/* Tailor's tape */
.tape { position: relative; display: flex; height: 22px; background: var(--tape); border-radius: 2px; overflow: hidden; color: var(--tape-ink); }
.tape span {
  flex: 1; position: relative; border-left: 1px solid var(--tape-ink);
  background:
    linear-gradient(var(--tape-ink), var(--tape-ink)) 50% 0 / 1px 8px no-repeat,
    repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px), var(--tape-ink) calc(25% - 1px) 25%) 0 0 / 100% 4px no-repeat;
  font: 500 0.58rem/1 var(--font-mono);
}
.tape span::after { content: attr(data-n); position: absolute; right: 3px; bottom: 3px; opacity: .85; }
.tape span:first-child { border-left: 0; }
.tape .fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: var(--accent); opacity: .72; transition: width .45s cubic-bezier(.3,.7,.3,1); }
.tape .fill::after { content: ""; position: absolute; right: -1px; top: -2px; bottom: -2px; width: 3px; background: var(--bad); }
.tape.measuring .fill { animation: measure 2.1s cubic-bezier(.4,.1,.2,1) forwards; }
@keyframes measure { to { width: 100%; } }
.measure-box { display: flex; flex-direction: column; gap: 14px; padding: 18px 16px; border: 1px dashed var(--muted); border-radius: 14px; }
.counter { display: flex; align-items: baseline; gap: 8px; }
.counter .big { font: 600 2.2rem/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.04em; }
.ticks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 0.95rem; }
.ticks li { display: flex; gap: 10px; align-items: baseline; opacity: .35; transition: opacity .3s; }
.ticks li.on { opacity: 1; }
.ticks li::before { content: "○"; font-family: var(--font-mono); color: var(--muted); }
.ticks li.on::before { content: "✓"; color: var(--good); font-weight: 700; }

/* Results */
.results { display: flex; flex-direction: column; gap: 22px; scroll-margin-top: 16px; }
.fx-results { animation: unroll .55s cubic-bezier(.2,.8,.2,1) both; transform-origin: top; }
@keyframes unroll { from { opacity: 0; transform: translateY(14px) scaleY(.97); } to { opacity: 1; transform: none; } }
.banner { border-radius: 12px; padding: 14px 16px; background: var(--tape-soft); border: 1px solid color-mix(in srgb, var(--tape) 70%, var(--line)); display: flex; flex-direction: column; gap: 6px; }
.banner.bad { background: color-mix(in srgb, var(--bad) 9%, var(--bg)); border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
.banner.personal { background: color-mix(in srgb, var(--good) 9%, var(--bg)); border-color: color-mix(in srgb, var(--good) 30%, var(--line)); }
.banner ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }

.v { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font: 700 0.8rem/1.3 var(--font-body); white-space: nowrap; }
.v::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.l0, .good { color: var(--good); } .lm1, .l2, .mixed { color: var(--snug); } .lm2, .bad { color: var(--bad); } .l1, .ok { color: var(--roomy); }
.v.l0, .v.good { background: color-mix(in srgb, var(--good) 13%, transparent); }
.v.lm1, .v.l2, .v.mixed { background: color-mix(in srgb, var(--snug) 14%, transparent); }
.v.lm2, .v.bad { background: color-mix(in srgb, var(--bad) 13%, transparent); }
.v.l1, .v.ok { background: color-mix(in srgb, var(--roomy) 13%, transparent); }

.glance-wrap { overflow-x: auto; margin-inline: -4px; }
table.glance { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.glance th, .glance td { padding: 9px 4px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
.glance thead th { font: 600 1.05rem/1 var(--font-mono); color: var(--fg); }
.glance tbody th { font-weight: 400; color: var(--muted); font-size: 0.84rem; line-height: 1.25; }
.glance .v { font-size: 0.76rem; padding: 2px 7px; }
.glance tr:last-child td, .glance tr:last-child th { border-bottom: 0; }
.glance td.sel { background: color-mix(in srgb, var(--accent) 6%, transparent); }

/* Size toggle */
.tabs { display: flex; gap: 8px; }
.tab { flex: 1 1 0; min-width: 0; min-height: 62px; border: 1px solid var(--line); border-radius: 12px; background: var(--field); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; padding: 8px 6px; transition: transform .1s; }
.tab:active { transform: scale(.97); }
.tab b { font: 700 1.25rem/1 var(--font-mono); }
.tab small { font-size: 0.7rem; color: var(--muted); text-align: center; line-height: 1.2; }
.tab[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--field)); }

/* Garment sketch with fit pins */
.sizehead { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: center; }
@media (max-width: 360px) { .sizehead { grid-template-columns: 110px 1fr; } }
.sketch { width: 100%; height: auto; display: block; }
.sketch .body { fill: var(--label); stroke: var(--muted); stroke-width: 1.6; stroke-linejoin: round; }
.sketch .stitch { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; opacity: .7; }
.sketch .pin { transform-box: fill-box; transform-origin: center; }
.sketch .pin circle { fill: currentColor; stroke: var(--field); stroke-width: 2.5; }
.sketch .pin text { fill: var(--field); font: 700 11px/1 var(--font-mono); text-anchor: middle; dominant-baseline: central; }
.fx-pins .pin { animation: pinIn .5s cubic-bezier(.3,1.8,.5,1) both; }
@keyframes pinIn { from { transform: translateY(-14px) scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }

.zones { display: flex; flex-direction: column; }
.zone { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 14px 0; border-top: 1px dashed var(--line); }
.zone:first-child { border-top: 0; padding-top: 2px; }
.zone .zn { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.zone .zn .pinno { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: currentColor; flex: none; }
.zone .zn .pinno i { font: 700 0.66rem/1 var(--font-mono); font-style: normal; color: var(--field); }
.zone .zt { grid-column: 1 / -1; }
.zone .personal-note { grid-column: 1 / -1; font: 700 0.95rem/1.4 var(--font-body); color: var(--good); }
.conf { display: flex; align-items: center; gap: 8px; justify-self: end; }
.ctape { position: relative; width: 60px; height: 10px; border-radius: 2px; background: var(--tape-soft); overflow: hidden;
  background-image: repeating-linear-gradient(90deg, transparent 0 5px, color-mix(in srgb, var(--tape-ink) 35%, transparent) 5px 6px); }
.ctape i { position: absolute; inset: 0 auto 0 0; background: var(--tape); border-right: 2px solid var(--tape-ink); }
.fx-results .ctape i, .fx-pins-z .ctape i { animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes grow { from { width: 0; } }
.conf span { font: 600 0.78rem/1 var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.conf span small { font-weight: 400; color: var(--muted); font-size: 0.72rem; }
.motion { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 0.95rem; padding-top: 12px; border-top: 1px dashed var(--line); }
.motion dt { font: 600 0.68rem/1.9 var(--font-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.motion dd { margin: 0; }
details summary { cursor: pointer; color: var(--muted); font-size: 0.92rem; padding-block: 4px; }
details[open] summary { margin-bottom: 8px; }
table.meas { width: 100%; border-collapse: collapse; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
.meas th, .meas td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; }
.meas th:first-child, .meas td:first-child { text-align: left; }
.meas thead th { font: 600 0.66rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.foot { color: var(--muted); font-size: 0.84rem; }

/* Fit report board */
.sv-prog { display: flex; flex-direction: column; gap: 8px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--field); padding-block: 8px; margin-top: -8px; }
.sv-prog .row { justify-content: space-between; }
.qrows { display: flex; flex-direction: column; }
.qrow { display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-top: 1px dashed var(--line); }
.qrow:first-child { border-top: 0; }
.qrow h4 { font: 600 1rem/1.3 var(--font-display); display: flex; gap: 8px; align-items: center; }
.qrow h4 .ck { width: 18px; height: 18px; border-radius: 50%; border: 1.5px dashed var(--muted); flex: none; display: grid; place-items: center; }
.qrow.answered h4 .ck { border: 0; background: var(--good); }
.qrow.answered h4 .ck::after { content: ""; width: 8px; height: 4px; border-left: 2px solid var(--bg); border-bottom: 2px solid var(--bg); transform: rotate(-45deg) translate(1px, -1px); }
.qrow.fx-new { animation: rise .35s ease both; }

/* Care label that sews itself on */
.carelabel { position: relative; padding: 20px 18px 18px; background: var(--label); border-radius: 4px; display: flex; flex-direction: column; gap: 10px; }

.carelabel .th.t2 { top: 6px; right: 6px; bottom: 6px; border-right-width: 1.6px; transform-origin: top; }
.carelabel .th.t3 { bottom: 6px; left: 6px; right: 6px; border-bottom-width: 1.6px; transform-origin: right; }
.carelabel .th.t4 { top: 6px; left: 6px; bottom: 6px; border-left-width: 1.6px; transform-origin: bottom; }

.fx-sew .th.t2, .fx-sew .th.t4 { animation: sewY .4s linear both; }

@keyframes sewY { from { transform: scaleY(0); } to { transform: scaleY(1); } }

.learn li b { font: 600 0.68rem/1.4 var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
pre.json { margin: 0; max-height: 340px; overflow: auto; padding: 14px; border-radius: 10px; background: var(--label); border: 1px solid var(--line); font: 400 0.75rem/1.5 var(--font-mono); white-space: pre; color: var(--fg); }
.histrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-top: 1px dashed var(--line); }
.histrow:first-child { border-top: 0; padding-top: 0; }
.histrow .t { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }

.stage { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }

  var match = rv && cz.variants ? (cz.variants.indexOf(rv) >= 0 ? rv : cz.variants.filter(function (v) { return grp(v) === grp(rv); })[0]) : null;
  if (match && grp(match) !== "reg") { check.candidate.variant = match; check.candidate.traits = withVariant(check.candidate.traits, match); }
  if (d.checkId) S.checks = S.checks.filter(function (c) { return c.id !== d.checkId || c.survey; });
  check.insights = computeInsights(check);
  S.checks.unshift(check);
  d.checkId = check.id;
  if (!S.favorites.some(function (f) { return f.url === check.reference.url && f.size === check.reference.size && (f.variant || null) === (check.reference.variant || null); })) {
    S.favorites.push({ category: check.category, url: check.reference.url, brand: check.reference.brand, knownBrand: check.reference.knownBrand, title: check.reference.title, traits: d.ref.traits, size: check.reference.size, system: check.reference.system, variant: check.reference.variant, addedAt: now() });
  }
  save();
  U.checkId = check.id; U.size = null; U.zone = null; U.touched = false; U.more = false;
}

function addCand(raw) {
  var p = parseLink(raw); U.draft.candRaw = raw;
  if (!p) { U.err.cand = String(raw).trim() ? "That doesn't look like a link. Copy it from the address bar or the share button." : "Paste a link first."; render(); return; }
  U.err = {}; U.draft.cand = p; U.fx.tagA = true; render();
  if (p.category) setTimeout(function () { var r = document.getElementById("ref-link"); if (r && !U.draft.ref) r.focus({ preventScroll: true }); }, 50);
}
function addRef(raw) {
  var q = parseLink(raw); U.draft.refRaw = raw;
  if (!q) { U.err.ref = String(raw).trim() ? "That doesn't look like a link. Copy it from the address bar or the share button." : "Paste a link first."; render(); return; }
  U.err = {}; U.draft.ref = q; U.draft.refSize = null; U.draft.refSys = null; U.fx.tagB = true; render();
}
function newBoard() { U.showSizes = false; U.showSys = false; stopMeasure(); U.draft = {}; U.checkId = null; U.size = null; U.zone = null; U.more = false; U.rp = null; U.err = {}; U.view = "board"; render(); window.scrollTo(0, 0); }
function openReport(id) {
  var c = findCheck(id); if (!c) return;
  pushState();
  U.rp = { id: id, a: {}, zone: null, edit: null, editing: false };
  U.view = "report"; U.fx.pins = true; render(); window.scrollTo(0, 0);
}

/* Hover or tap a spot on the garment (results) */
function setZone(z) {
  if (U.view !== "board" || !U.checkId) return;
  var c = findCheck(U.checkId); if (!c) return;
  if (U.zone === z && U.touched) return;
  U.zone = z; U.touched = true;
  var p = document.getElementById("zinfo"); if (p) p.outerHTML = zoneInfo(c, U.size, z);
  app.querySelectorAll("#results .pin").forEach(function (el) { el.classList.remove("idle"); el.classList.toggle("on", el.getAttribute("data-zone") === z); });
  app.querySelectorAll("#results .zarea").forEach(function (el) { el.classList.toggle("show", el.getAttribute("data-area") === z); });
  app.querySelectorAll("#results .zdot").forEach(function (el) { el.setAttribute("aria-pressed", String(el.getAttribute("data-zone") === z)); });
}
app.addEventListener("mouseover", function (e) { var t = e.target.closest && e.target.closest("#results [data-zone]"); if (t) setZone(t.getAttribute("data-zone")); });
app.addEventListener("focusin", function (e) { var t = e.target.closest && e.target.closest("#results [data-zone]"); if (t) setZone(t.getAttribute("data-zone")); });
app.addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("g.pin")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });

/* ---------- Events ---------- */
app.addEventListener("submit", function (e) {
  e.preventDefault();
  var form = e.target.getAttribute("data-form");
  if (form === "cand") addCand(app.querySelector("#cand-link").value);
  else if (form === "ref") addRef(app.querySelector("#ref-link").value);
  else if (form === "size-other") {
    var so = (app.querySelector("#size-other").value || "").trim();
    if (!so) { app.querySelector("#size-other").focus(); return; }
    U.rp.a.sizeOther = so; delete U.rp.a.sizeOtherDraft; if (U.rp.edit === "size") U.rp.edit = null; render();
  }
  else if (form === "name") {
    var nm = (app.querySelector("#fname").value || "").trim() || "there";
    S.user = { id: S.user && S.user.id || "demo_" + uid(), name: nm, provider: U.provider, signedInAt: now() };
    save(); U.provider = null; U.stack = []; newBoard();
  }
});
app.addEventListener("paste", function (e) {
  var id = e.target && e.target.id;
  if (id !== "cand-link" && id !== "ref-link") return;
  setTimeout(function () { var v = e.target.value; if (parseLink(v)) (id === "cand-link" ? addCand : addRef)(v); }, 0);
});
app.addEventListener("input", function (e) {
  if (U.rp && e.target.id === "size-other") U.rp.a.sizeOtherDraft = e.target.value;
  if (U.rp && e.target.id === "tailor-other") U.rp.a.tailoringOther = e.target.value.trim();
  if (U.rp && e.target.id === "rp-notes") U.rp.a.otherNotes = e.target.value.trim();
  if (e.target.id === "cand-link") U.draft.candRaw = e.target.value;
  if (e.target.id === "ref-link") U.draft.refRaw = e.target.value;
});
document.addEventListener("click", function (e) {
  var zt = e.target.closest && e.target.closest("[data-zone]");
  if (zt && !e.target.closest("[data-act]")) {
    var z = zt.getAttribute("data-zone");
    if (U.view === "board") { setZone(z); return; }
    if (U.view === "report" && U.rp) { U.rp.zone = z; U.rp.zoneEdit = true; U.rp.edit = null; render(); return; }
  }
  var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  var act = b.getAttribute("data-act"), d = U.draft;
  if (act !== "reset") U.confirmReset = false;
  switch (act) {
    case "back": goBack(); break;
    case "home": if (!S.user) break; if (U.view !== "board") go("board"); else window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "profile": go("profile"); break;
    case "provider": U.provider = b.getAttribute("data-p"); render(); break;
    case "signout": S.user = null; save(); U.stack = []; U.view = "signin"; render(); break;
    case "new": pushState(); newBoard(); break;
    case "sample": addCand(SAMPLES[b.getAttribute("data-c")].cand); break;
    case "setcat": d.cand.category = b.getAttribute("data-c"); vibrate(); render(); break;
    case "clear-cand": pushState(); d.cand = null; d.candRaw = ""; d.ref = null; d.refRaw = ""; d.refSize = null; d.checkId = null; U.checkId = null; render(); break;
    case "clear-ref": pushState(); d.ref = null; d.refRaw = ""; d.refSize = null; d.refSys = null; U.showSizes = false; render(); setTimeout(function () { var r = document.getElementById("ref-link"); if (r) r.focus({ preventScroll: true }); }, 30); break;
    case "refsample": addRef(SAMPLES[d.cand.category].ref); break;
    case "usefav":
      var f = S.favorites[+b.getAttribute("data-i")];
      d.refRaw = f.url; d.ref = { url: f.url, brand: f.brand, knownBrand: f.knownBrand, title: f.title, category: f.category, traits: f.traits };
      d.refSize = f.size; d.refSys = f.system; d.refVariant = f.variant || null; U.fx.tagB = true; vibrate(); render(); break;
    case "show-sizes": U.showSizes = true; render(); break;
    case "refsize": U.showSizes = false; d.refSize = b.getAttribute("data-s"); U.just = "ref:" + d.refSize; vibrate(); render(); break;
    case "showsys": U.showSys = true; render(); break;
    case "refsys": d.refSys = b.getAttribute("data-sys"); d.refSize = null; render(); break;
    case "refvar": d.refVariant = b.getAttribute("data-v"); U.showSizes = true; vibrate(); render(); break;
    case "measure": pushState(); startCheck(); U.measuring = true; render(); scrollToEl("measure"); runMeasure(); break;
    case "size": U.size = b.getAttribute("data-s"); U.fx.pins = true; vibrate(); render(); break;
    case "more": U.more = !U.more; U.fx.more = U.more; render(); break;
    case "open":
      pushState();
      var oc = findCheck(b.getAttribute("data-id"));
      U.view = "board"; U.draft = draftFromCheck(oc); U.checkId = oc.id; U.size = null; U.zone = null; U.touched = false; U.more = false; U.rp = null;
      U.fx = { results: true, pins: true }; render(); setTimeout(function () { scrollToEl("results"); }, 30); break;
    case "report": openReport(b.getAttribute("data-id")); break;
    case "later":
      var lc = findCheck(b.getAttribute("data-id")); lc.remindLater = now(); save();
      toast("Saved. It's waiting in your profile."); pushState(); newBoard(); break;
    case "rp-pick": rpPick(b); break;
    case "rp-toggle":
      U.rp.tmp = U.rp.tmp || {};
      var q = b.getAttribute("data-q"), v = b.getAttribute("data-v"), arr = U.rp.tmp[q] || U.rp.a[q] || [];
      U.rp.tmp[q] = arr.indexOf(v) >= 0 ? arr.filter(function (x) { return x !== v; }) : arr.concat([v]); U.just = q + ":" + v; vibrate(); render(); break;
    case "rp-done":
      var mq = b.getAttribute("data-q"); U.rp.a[mq] = (U.rp.tmp && U.rp.tmp[mq]) || U.rp.a[mq] || []; if (U.rp.tmp) delete U.rp.tmp[mq];
      U.rp.edit = null; render(); break;
    case "rp-edit": U.rp.edit = b.getAttribute("data-q"); if (U.rp.edit === "tailoring") { /* keep current picks */ } render(); break;
    case "rp-save":
      var sc = findCheck(U.rp.id); finishSurvey(sc, U.rp.a); U.rp.editing = false; U.fx.sew = true; render(); window.scrollTo(0, 0); toast("✓ Fit report saved"); break;
    case "rp-reedit":
      var rc = findCheck(U.rp.id); U.rp = { id: rc.id, a: answersFrom(rc), zone: null, edit: null, editing: true }; render(); break;
    case "copy":
      var ok = function () { var el = document.getElementById("copied"); if (el) el.textContent = "Copied"; };
      var fb = function () { var det = app.querySelector("details"); if (det) det.open = true; var r = document.createRange(); r.selectNodeContents(document.getElementById("json")); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); var el = document.getElementById("copied"); if (el) el.textContent = "Selected. Copy it from here."; };
      try { navigator.clipboard.writeText(U.exportTxt).then(ok, fb); } catch (err) { fb(); }
      break;
    case "reset":
      if (!U.confirmReset) { U.confirmReset = true; render(); break; }
      U.confirmReset = false; S = fresh(); save(); U.stack = []; U.draft = {}; U.checkId = null; U.view = "signin"; render(); break;
  }
});
function answersFrom(c) {
  var sv = c.survey, a = {};
  a.bought = sv.bought === "yes" ? "Yes" : "Decided not to";
  if (sv.whyNot) a.whyNot = sv.whyNot;
  if (sv.size) { a.size = sv.size; if (sv.sizeWrittenIn) { a.size = "A different size"; a.sizeOther = sv.size; } }
  if (sv.tailoringOther) a.tailoringOther = sv.tailoringOther;
  if (sv.otherNotes) a.otherNotes = sv.otherNotes;
  Object.keys(sv.fit || {}).forEach(function (z) { a["fit:" + z] = sv.fit[z].answer; });
  if (sv.sittingComfort) a.sitting = sv.sittingComfort;
  if (sv.outcome) a.outcome = sv.outcome;
  if (sv.outcome === "Kept it and got it tailored") a.tailoring = sv.tailoring || [];
  if (sv.returnReason) a.returnReason = sv.returnReason;
  if (sv.notesAccuracy) a.accuracy = sv.notesAccuracy;
  return a;
}
function rpPick(b) {
  var c = findCheck(U.rp.id), id = b.getAttribute("data-q"), v = b.getAttribute("data-v");
  U.rp.a[id] = v;
  if (id === "bought") Object.keys(U.rp.a).forEach(function (k) { if (k !== "bought") delete U.rp.a[k]; });
  if (id === "outcome") { delete U.rp.a.tailoring; delete U.rp.a.returnReason; }
  vibrate(); U.just = id + ":" + v;
  if (id === "bought" && v === "Not yet") { finishSurvey(c, U.rp.a); toast("Okay, we'll ask again later"); goBack(); return; }
  if (id === "size" && v !== "A different size") delete U.rp.a.sizeOther;
  if (U.rp.edit === id && !(id === "size" && v === "A different size")) U.rp.edit = null;
  if (id.indexOf("fit:") === 0) { U.rp.zoneEdit = false; U.rp.zone = null; U.fx.pins = false; }
  render();
}

render();
})();
</script>
</body>
